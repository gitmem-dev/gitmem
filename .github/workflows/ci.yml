name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke test (free tier)
        run: npm run test:smoke:free

      # GIT-89: session identity across a real MCP server restart. Runs the
      # single e2e file rather than `npm run test:e2e`, because the Pro suites in
      # that config gate on Docker/Supabase and hang rather than skip when
      # neither is present (GIT-90). This file spawns the built server directly
      # on the free tier — no Docker, no credentials — so it is safe in CI, and
      # the publish job gates on this one passing.
      - name: E2E — session identity survives MCP restart
        run: npx vitest run --config vitest.e2e.config.ts tests/e2e/git-89-session-identity.test.ts

      - name: Dependency audit (no unused deps)
        run: npx depcheck --ignores="@types/*" --json | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); const unused=d.dependencies||[]; if(unused.length){console.error('Unused dependencies:',unused);process.exit(1)}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # A tag now BUILDS but does not publish. This environment requires a named
    # reviewer to approve the deployment in the GitHub UI before npm publish
    # runs, so the release hold exists mechanically rather than by convention.
    #
    # Why: the hold on releasing was an instruction, and an instruction-only
    # hold on an irreversible action has no failure signal — nothing physically
    # prevents the action, so nothing reports when it happens without the
    # approval. That is the same shape as scar b6fa8f3c (a gate triggered only
    # by human intent has no failure signal between uses), applied to release
    # authority instead of to a test harness.
    #
    # SETUP REQUIRED before this has any effect — create the environment in
    # GitHub and add the required reviewer:
    #   Settings -> Environments -> New environment -> "npm-production"
    #   -> Deployment protection rules -> Required reviewers -> add Chris
    # Until that environment exists with a reviewer, this line names an
    # unprotected environment and publish proceeds as before.
    environment: npm-production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
